name: Compile DailyPuck Stats

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 09:00 UTC (5:00 AM EDT / 4:00 AM EST)
    - cron: '0 9 * * *'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Stats Compiler
        env:
          GAMESHEET_COOKIE: ${{ secrets.GAMESHEET_COOKIE }}
          GAMESHEET_AUTH: ${{ secrets.GAMESHEET_AUTH }}
        run: python compile_stats.py

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hockey_stats.json
          git commit -m "Auto-update hockey_stats.json [skip ci]" || echo "No changes to commit"
          git push
